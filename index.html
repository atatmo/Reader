<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile HTML Reader</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <style>
        :root {
            --surface-color: #ffffff;
            --surface-elevated: #f3f4f6;
            --text-main: #111827;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --accent: #2563eb;
            --accent-active: #1d4ed8;
            --note-bg: #f8fafc;
            --note-marker-bg: #f3f4f6;
            --note-marker-border: #d1d5db;
            --note-marker-active-bg: #dbeafe;
            --note-marker-active-border: #93c5fd;
            --note-marker-active-text: #1e40af;
            --reader-font-size: 17px;
        }

        /* TRYB CIEMNY */
        [data-theme="dark"] {
            --surface-color: #111827;
            --surface-elevated: #1f2937;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --border-color: #374151;
            --accent: #3b82f6;
            --accent-active: #2563eb;
            --note-bg: #1e293b;
            --note-marker-bg: #374151;
            --note-marker-border: #4b5563;
            --note-marker-active-bg: #1e3a8a;
            --note-marker-active-border: #3b82f6;
            --note-marker-active-text: #bfdbfe;
        }

        /* TARCZA ANTY-SINGLEFILE */
        html, body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important; 
            margin: 0 !important; 
            background-color: var(--surface-color) !important; 
            color: var(--text-main) !important;
            line-height: 1.6 !important;
            -webkit-font-smoothing: antialiased !important;
            scroll-behavior: smooth;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        /* PASEK POSTĘPU CZYTANIA */
        #progress-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 4px;
            background: transparent;
            z-index: 1001;
            pointer-events: none;
        }
        #progress-bar {
            height: 100%;
            width: 0%;
            background: var(--accent);
            transition: width 0.1s ease-out;
        }
        
        /* =========================================
           INTERFEJS (UKRYTE MENU Z DOŁU)
           ========================================= */

        #menu-btn {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 50%;
            width: 56px;
            height: 56px;
            font-size: 24px;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
            z-index: 1000;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease, background 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        #menu-btn:active { transform: scale(0.92); background: var(--accent-active); }

        #backdrop {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 998;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(2px);
        }
        #backdrop.open {
            opacity: 1;
            pointer-events: all;
        }

        #controls { 
            position: fixed;
            bottom: 0; left: 0; width: 100%;
            background: var(--surface-color); 
            color: var(--text-main);
            padding: 14px 18px 26px 18px; 
            box-sizing: border-box;
            border-radius: 24px 24px 0 0;
            box-shadow: 0 -10px 25px rgba(0,0,0,0.18);
            z-index: 999; 
            transform: translateY(110%);
            transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
            height: 86vh;
            max-height: 86vh;
            display: flex;
            flex-direction: column;
        }
        #controls.open {
            transform: translateY(0);
        }

        .menu-drag-handle {
            width: 40px;
            height: 5px;
            background: var(--border-color);
            border-radius: 3px;
            margin: 0 auto 10px auto;
            flex-shrink: 0;
        }

        /* GÓRNY PASEK: PLIK + SZYBKIE OPCJE */
        .top-bar-row {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            flex-shrink: 0;
            align-items: center;
        }
        .file-btn-label {
            flex: 1;
            background: var(--surface-elevated);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 9px 12px;
            border-radius: 10px;
            font-size: 13.5px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #fileInput { display: none; }

        .tool-btn {
            background: var(--surface-elevated);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 9px 11px;
            border-radius: 10px;
            font-size: 13.5px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .tool-btn:active, .file-btn-label:active {
            filter: brightness(0.9);
        }

        /* PRZEŁĄCZNIK ZAKŁADEK W MENU (SPIS TREŚCI vs NOTATKI) */
        .menu-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: var(--surface-elevated);
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 12px;
            flex-shrink: 0;
            border: 1px solid var(--border-color);
        }
        .menu-tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 8px 10px;
            border-radius: 9px;
            font-size: 13.5px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .menu-tab-btn.active {
            background: var(--surface-color);
            color: var(--text-main);
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }

        /* WIDOKI ZAKŁADEK */
        .tab-pane {
            display: none;
            flex-direction: column;
            flex-grow: 1;
            min-height: 0;
            overflow: hidden;
        }
        .tab-pane.active {
            display: flex;
        }

        /* WSPÓLNE POLE WYSZUKIWANIA */
        .search-input {
            width: 100%;
            box-sizing: border-box;
            padding: 9px 12px;
            margin-bottom: 10px;
            border-radius: 9px;
            border: 1px solid var(--border-color);
            background: var(--surface-elevated);
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            flex-shrink: 0;
        }
        .search-input:focus {
            border-color: var(--accent);
        }

        /* =========================================
           ZAKŁADKA 1: SPIS TREŚCI
           ========================================= */
        #toc { 
            overflow-y: auto; 
            flex-grow: 1;
            padding-right: 4px;
        }
        #tocList { margin: 0; padding-left: 0; list-style: none; font-size: 15px; }
        #tocList li { border-bottom: 1px solid var(--border-color); }
        #tocList a { 
            color: var(--text-main); 
            text-decoration: none; 
            display: block; 
            padding: 10px 4px;
            line-height: 1.4;
        }
        #tocList a:active { background-color: var(--surface-elevated); }
        .toc-h1 { font-weight: 700; }
        .toc-h2 { padding-left: 16px !important; font-weight: 500; font-size: 14px; }
        .toc-h3 { padding-left: 32px !important; color: var(--text-muted) !important; font-size: 13.5px; }

        /* =========================================
           ZAKŁADKA 2: FILTRY I LISTA NOTATEK
           ========================================= */
        #noteCategoryChips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 10px;
            max-height: 86px;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .category-chip {
            background: var(--surface-elevated);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 999px;
            padding: 5px 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.15s ease;
        }
        .category-chip .chip-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .category-chip.active {
            background: var(--accent);
            color: #ffffff;
            border-color: var(--accent);
        }
        .category-chip.active .chip-dot {
            background: #ffffff !important;
        }
        .category-chip .chip-count {
            font-size: 11px;
            opacity: 0.85;
            background: rgba(0,0,0,0.08);
            padding: 1px 6px;
            border-radius: 999px;
        }
        .category-chip.active .chip-count {
            background: rgba(255,255,255,0.22);
        }

        .notes-toolbar-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            flex-shrink: 0;
            flex-wrap: wrap;
        }

        .hide-unmatched-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12.5px;
            color: var(--text-muted);
            cursor: pointer;
            user-select: none;
        }

        .notes-actions-group {
            display: flex;
            gap: 6px;
        }
        .notes-action-btn {
            background: var(--surface-elevated);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        .notes-action-btn.primary {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        /* PRZEWIJANA LISTA KART NOTATEK */
        #filteredNotesList {
            overflow-y: auto;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 4px;
        }

        .note-list-card {
            background: var(--surface-elevated);
            border: 1px solid var(--border-color);
            border-left: 5px solid #3b82f6;
            border-radius: 10px;
            padding: 10px 12px;
            cursor: pointer;
            transition: transform 0.12s ease, background 0.15s ease;
        }
        .note-list-card:active {
            transform: scale(0.98);
        }
        .note-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }
        .note-card-badge {
            font-size: 10.5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            padding: 2px 7px;
            border-radius: 6px;
            background: rgba(59, 130, 246, 0.12);
            color: var(--text-main);
        }
        .note-card-section {
            font-size: 11px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 55%;
        }
        .note-card-preview {
            font-size: 13px;
            color: var(--text-main);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* =========================================
           CZYTNIK (EDGE-TO-EDGE)
           ========================================= */

        #viewer-container { 
            width: 100%; 
            min-height: 100vh; 
            padding: 12px 12px 100px 12px !important;
            box-sizing: border-box !important;
            overflow-x: hidden !important; 
            background-color: var(--surface-color) !important;
        }
        
        #contentArea { 
            word-wrap: break-word; 
            font-size: var(--reader-font-size) !important; 
            background-color: var(--surface-color) !important;
            color: var(--text-main) !important;
        }

        [data-theme="dark"] #contentArea *:not(.wnl-note-marker):not(.wnl-extracted-note) {
            background-color: transparent !important;
            color: inherit !important;
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            margin-top: 38vh;
            padding: 0 20px;
        }

        /* OBRAZKI EDGE-TO-EDGE */
        .wnl-extracted-image, #contentArea > img {
            margin: 24px -12px !important;
            padding: 0 !important;
            background: transparent !important;
            border-radius: 0 !important;
            width: calc(100% + 24px) !important;
            max-width: calc(100% + 24px) !important;
            box-sizing: border-box !important;
        }
        
        .wnl-extracted-image img, #contentArea img {
            max-width: 100% !important;
            height: auto !important;
            border-radius: 0 !important;
            display: block;
            margin: 0 auto;
            cursor: zoom-in;
        }

        /* =========================================
           ZNACZNIKI I ROZWIJANE NOTATKI W TEKŚCIE
           ========================================= */

        .wnl-note-marker {
            cursor: pointer;
            background-color: var(--note-marker-bg) !important;
            color: var(--text-main) !important;
            border: 1px solid var(--note-marker-border) !important;
            border-left-width: 4px !important;
            border-radius: 6px;
            padding: 2px 8px !important;
            margin: 0 4px;
            font-weight: 500;
            user-select: none;
            display: inline-block; 
            transition: opacity 0.2s ease, transform 0.15s ease, background-color 0.15s ease;
        }
        .wnl-note-marker.active { 
            background-color: var(--note-marker-active-bg) !important; 
            border-color: var(--note-marker-active-border) !important; 
            color: var(--note-marker-active-text) !important;
        }

        .wnl-note-marker.filter-dimmed {
            opacity: 0.25 !important;
            filter: grayscale(1);
        }
        .wnl-note-marker.filter-hidden {
            display: none !important;
        }

        .wnl-extracted-note {
            display: none !important; 
            opacity: 0;
            width: calc(100% + 24px) !important; 
            box-sizing: border-box !important; 
            margin: 16px -12px !important; 
            padding: 18px 16px !important;
            border-radius: 0 !important; 
            background: var(--note-bg) !important;
            color: var(--text-main) !important;
            box-shadow: inset 0px 6px 8px -4px rgba(0,0,0,0.08), inset 0px -6px 8px -4px rgba(0,0,0,0.08) !important;
            border: none !important;
            border-left: 6px solid #3b82f6 !important;
            clear: both !important;
        }
        
        .wnl-extracted-note.is-expanded {
            display: block !important;
            opacity: 1;
            animation: slideDown 0.2s ease-out forwards;
        }

        /* Pulsowanie po skoku z listy notatek */
        @keyframes highlightPulse {
            0% { outline: 3px solid var(--accent); outline-offset: -3px; }
            100% { outline: 3px solid transparent; outline-offset: 0px; }
        }
        .wnl-extracted-note.jump-highlight {
            animation: highlightPulse 1.4s ease-out;
        }
        
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* KOLORYSTYKA KATEGORII NOTATEK */
        .wnl-extracted-note[data-resolved-cat="egzamin"], .note-list-card[data-resolved-cat="egzamin"], .wnl-note-marker[data-resolved-cat="egzamin"] {
            border-left-color: #ef4444 !important;
        }
        .wnl-extracted-note[data-resolved-cat="specjalistyczna"], .note-list-card[data-resolved-cat="specjalistyczna"], .wnl-note-marker[data-resolved-cat="specjalistyczna"] {
            border-left-color: #0ea5e9 !important;
        }
        .wnl-extracted-note[data-resolved-cat="mnemotechnika"], .note-list-card[data-resolved-cat="mnemotechnika"], .wnl-note-marker[data-resolved-cat="mnemotechnika"] {
            border-left-color: #a855f7 !important;
        }
        .wnl-extracted-note[data-resolved-cat="kliniczna"], .note-list-card[data-resolved-cat="kliniczna"], .wnl-note-marker[data-resolved-cat="kliniczna"] {
            border-left-color: #10b981 !important;
        }
        .wnl-extracted-note[data-resolved-cat="uwaga"], .note-list-card[data-resolved-cat="uwaga"], .wnl-note-marker[data-resolved-cat="uwaga"] {
            border-left-color: #f59e0b !important;
        }

        /* LIGHTBOX */
        #lightbox {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.92);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            overflow: auto;
            touch-action: pinch-zoom pan-x pan-y;
        }
        #lightbox.active { display: flex; }
        #lightbox img {
            max-width: 96%;
            max-height: 92vh;
            object-fit: contain;
        }
        #lightbox-close {
            position: fixed;
            top: 20px; right: 20px;
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            border-radius: 50%;
            width: 44px; height: 44px;
            font-size: 22px;
            cursor: pointer;
            z-index: 2001;
        }
    </style>
</head>
<body>

<div id="progress-container"><div id="progress-bar"></div></div>

<button id="menu-btn" aria-label="Otwórz menu">📚</button>
<div id="backdrop"></div>

<div id="controls">
    <div class="menu-drag-handle"></div>

    <!-- PASEK PLIKU I WYGLĄDU -->
    <div class="top-bar-row">
        <label class="file-btn-label" for="fileInput" id="fileLabel">📂 Wczytaj plik .html</label>
        <input type="file" id="fileInput" accept=".html,.htm">
        <button class="tool-btn" id="btnFontDec" title="Zmniejsz czcionkę">A−</button>
        <button class="tool-btn" id="btnFontInc" title="Zwiększ czcionkę">A+</button>
        <button class="tool-btn" id="btnTheme" title="Zmień motyw">🌓</button>
    </div>

    <!-- PRZEŁĄCZNIK ZAKŁADEK -->
    <div class="menu-tabs">
        <button class="menu-tab-btn active" data-tab="tab-toc">📑 Spis treści</button>
        <button class="menu-tab-btn" data-tab="tab-notes">📝 Baza notatek (<span id="tabNotesCount">0</span>)</button>
    </div>

    <!-- ZAKŁADKA 1: SPIS TREŚCI -->
    <div id="tab-toc" class="tab-pane active">
        <input type="text" id="tocSearch" class="search-input" placeholder="Szukaj rozdziału...">
        <div id="toc">
            <ul id="tocList">
                <li style="color: var(--text-muted); text-align: center; padding: 24px 0; border: none;">Brak wczytanego spisu treści.</li>
            </ul>
        </div>
    </div>

    <!-- ZAKŁADKA 2: FILTROWANIE I LISTA NOTATEK -->
    <div id="tab-notes" class="tab-pane">
        <input type="text" id="noteSearchInput" class="search-input" placeholder="Szukaj w notatkach (np. lek, objaw, dawka)...">

        <!-- Pigułki kategorii (Wiedza do egzaminu, Specjalistyczna, Mnemotechnika itd.) -->
        <div id="noteCategoryChips"></div>

        <div class="notes-toolbar-row">
            <label class="hide-unmatched-label">
                <input type="checkbox" id="chkHideUnmatched">
                Ukryj odrzucone w tekście
            </label>
            <div class="notes-actions-group">
                <button class="notes-action-btn primary" id="btnExpandFiltered">Rozwiń w tekście</button>
                <button class="notes-action-btn" id="btnCollapseAll">Zwiń wszystkie</button>
            </div>
        </div>

        <!-- Lista przefiltrowanych notatek z nawigacją po kliknięciu -->
        <div id="filteredNotesList">
            <div style="color: var(--text-muted); text-align: center; padding: 24px 0;">Wczytaj plik, aby zobaczyć listę notatek.</div>
        </div>
    </div>
</div>

<div id="viewer-container">
    <div id="contentArea">
        <div class="empty-state">
            Wczytaj bazę (.html) z menu w prawym dolnym rogu.
        </div>
    </div>
</div>

<!-- Lightbox -->
<div id="lightbox">
    <button id="lightbox-close">✕</button>
    <img id="lightbox-img" src="" alt="Powiększony obraz">
</div>

<script>
    const menuBtn = document.getElementById('menu-btn');
    const controls = document.getElementById('controls');
    const backdrop = document.getElementById('backdrop');
    const contentArea = document.getElementById('contentArea');
    const tocList = document.getElementById('tocList');
    const tocSearch = document.getElementById('tocSearch');
    const progressBar = document.getElementById('progress-bar');

    const noteSearchInput = document.getElementById('noteSearchInput');
    const noteCategoryChips = document.getElementById('noteCategoryChips');
    const chkHideUnmatched = document.getElementById('chkHideUnmatched');
    const filteredNotesList = document.getElementById('filteredNotesList');
    const tabNotesCount = document.getElementById('tabNotesCount');

    // Słownik rozpoznawanych kategorii i ich stylów
    const CATEGORY_DEFINITIONS = {
        egzamin: {
            label: '🎯 Wiedza do egzaminu',
            color: '#ef4444',
            keywords: ['egzamin', 'wiedza do egzaminu', 'lek', 'ldk', 'pes', 'pytanie egzaminacyjne', 'pewniak', 'do zapamiętania', 'zapamiętaj', 'kluczowe', 'must know']
        },
        specjalistyczna: {
            label: '🔬 Wiedza specjalistyczna',
            color: '#0ea5e9',
            keywords: ['specjalistyczn', 'wiedza specjalistyczna', 'zaawansowan', 'dla chętnych', 'rozszerzen', 'dodatkow', 'szczegół', 'ciekawostk', 'ponadprogram']
        },
        mnemotechnika: {
            label: '🧠 Mnemotechnika',
            color: '#a855f7',
            keywords: ['mnemo', 'skojarzen', 'wierszyk', 'akronim', 'skrót']
        },
        kliniczna: {
            label: '🩺 Praktyka kliniczna',
            color: '#10b981',
            keywords: ['kliniczn', 'praktyk', 'w praktyce', 'dyżur', 'pacjent', 'przypadek', 'wskazówka']
        },
        uwaga: {
            label: '⚠️ Pułapka / Uwaga',
            color: '#f59e0b',
            keywords: ['pułapk', 'uwaga', 'błąd', 'ostrożnie', 'czerwona flaga', 'red flag', 'kontrowersj']
        },
        ogolne: {
            label: '📌 Przypis ogólny',
            color: '#3b82f6',
            keywords: []
        }
    };

    // Stan filtrów (można wybrać ALL albo zestaw kilku kategorii naraz)
    let selectedCategories = new Set(['ALL']);
    let activeNoteQuery = '';
    let hideUnmatchedMarkers = false;
    let indexedNotes = []; // Tablica obiektów wszystkich notatek w dokumencie

    // =========================================
    // 1. MENU, ZAKŁADKI, MOTYW I CZCIONKA
    // =========================================
    function toggleMenu(forceState) {
        const isOpen = typeof forceState === 'boolean' ? forceState : !controls.classList.contains('open');
        controls.classList.toggle('open', isOpen);
        backdrop.classList.toggle('open', isOpen);
    }

    menuBtn.addEventListener('click', () => toggleMenu());
    backdrop.addEventListener('click', () => toggleMenu(false));

    // Przełączanie zakładek w menu (Spis treści / Baza notatek)
    document.querySelectorAll('.menu-tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.menu-tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(btn.dataset.tab).classList.add('active');
        });
    });

    let currentFontSize = parseInt(localStorage.getItem('readerFontSize')) || 17;
    let currentTheme = localStorage.getItem('readerTheme') || 'light';

    function applyPreferences() {
        document.documentElement.style.setProperty('--reader-font-size', `${currentFontSize}px`);
        document.documentElement.setAttribute('data-theme', currentTheme);
    }
    applyPreferences();

    document.getElementById('btnFontDec').addEventListener('click', () => {
        if (currentFontSize > 13) {
            currentFontSize -= 1;
            localStorage.setItem('readerFontSize', currentFontSize);
            applyPreferences();
        }
    });

    document.getElementById('btnFontInc').addEventListener('click', () => {
        if (currentFontSize < 26) {
            currentFontSize += 1;
            localStorage.setItem('readerFontSize', currentFontSize);
            applyPreferences();
        }
    });

    document.getElementById('btnTheme').addEventListener('click', () => {
        currentTheme = currentTheme === 'light' ? 'dark' : 'light';
        localStorage.setItem('readerTheme', currentTheme);
        applyPreferences();
    });

    window.addEventListener('scroll', () => {
        const scrollTop = window.scrollY || document.documentElement.scrollTop;
        const docHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
        const progress = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
        progressBar.style.width = `${progress}%`;
    }, { passive: true });

    // =========================================
    // 2. INTELIGENTNA KLASYFIKACJA I INDEKSOWANIE NOTATEK
    // =========================================
    function detectNoteCategory(noteDiv, marker) {
        // 1. Sprawdzenie jawnych atrybutów data-category / data-type / class
        const rawAttr = [
            noteDiv.getAttribute('data-category'),
            noteDiv.getAttribute('data-type'),
            marker.getAttribute('data-category'),
            marker.getAttribute('title'),
            noteDiv.className,
            marker.className
        ].filter(Boolean).join(' ').toLowerCase();

        // 2. Pobranie pierwszych 120 znaków notatki oraz tekstu znacznika
        const headerEl = noteDiv.querySelector('strong, b, h1, h2, h3, h4, h5, .note-title, .title');
        const headerText = headerEl ? headerEl.textContent.toLowerCase() : '';
        const startText = noteDiv.textContent.trim().slice(0, 120).toLowerCase();
        const markerText = marker.textContent.trim().toLowerCase();

        const combinedSample = `${rawAttr} ${markerText} ${headerText} ${startText}`;

        for (const [catKey, def] of Object.entries(CATEGORY_DEFINITIONS)) {
            if (catKey === 'ogolne') continue;
            if (def.keywords.some(kw => combinedSample.includes(kw))) {
                return catKey;
            }
        }

        // Jeśli w data-category jest niestandardowa nazwa, której nie ma w słowniku
        const customCat = (noteDiv.getAttribute('data-category') || marker.getAttribute('data-category') || '').trim().toLowerCase();
        if (customCat) {
            if (!CATEGORY_DEFINITIONS[customCat]) {
                CATEGORY_DEFINITIONS[customCat] = {
                    label: '🏷️ ' + customCat.charAt(0).toUpperCase() + customCat.slice(1),
                    color: '#6366f1',
                    keywords: []
                };
            }
            return customCat;
        }

        return 'ogolne';
    }

    // Znajduje najbliższy nagłówek rozdziału nad znacznikiem notatki
    function findNearestHeadingText(element) {
        const headers = Array.from(contentArea.querySelectorAll('h1, h2, h3'));
        let lastHeader = 'Początek dokumentu';
        for (const h of headers) {
            if (h.compareDocumentPosition(element) & Node.DOCUMENT_POSITION_FOLLOWING) {
                lastHeader = h.textContent.trim();
            } else {
                break;
            }
        }
        return lastHeader;
    }

    function initNotesFilterSystem() {
        selectedCategories = new Set(['ALL']);
        activeNoteQuery = '';
        noteSearchInput.value = '';
        noteCategoryChips.innerHTML = '';
        indexedNotes = [];

        const markers = contentArea.querySelectorAll('.wnl-note-marker');
        const categoryCounts = { ALL: 0 };

        markers.forEach((marker, idx) => {
            const targetId = marker.getAttribute('data-target-note');
            const noteDiv = targetId ? document.getElementById(targetId) : null;
            if (!noteDiv) return;

            const catKey = detectNoteCategory(noteDiv, marker);
            marker.setAttribute('data-resolved-cat', catKey);
            noteDiv.setAttribute('data-resolved-cat', catKey);

            const cleanPreview = noteDiv.textContent.replace(/\s+/g, ' ').trim();
            const sectionTitle = findNearestHeadingText(marker);

            indexedNotes.push({
                index: idx,
                marker,
                noteDiv,
                catKey,
                sectionTitle,
                previewText: cleanPreview,
                searchHaystack: `${marker.textContent} ${cleanPreview} ${sectionTitle}`.toLowerCase()
            });

            categoryCounts.ALL += 1;
            categoryCounts[catKey] = (categoryCounts[catKey] || 0) + 1;
        });

        tabNotesCount.textContent = categoryCounts.ALL;

        if (categoryCounts.ALL === 0) {
            filteredNotesList.innerHTML = '<div style="color: var(--text-muted); text-align: center; padding: 24px 0;">W tym pliku nie wykryto żadnych notatek (.wnl-note-marker).</div>';
            return;
        }

        // Pigułka "Wszystkie"
        createCategoryChip('ALL', 'Wszystkie', '#2563eb', categoryCounts.ALL);

        // Kolejność priorytetowa pigułek (Egzamin i Specjalistyczna na początku)
        const priorityOrder = ['egzamin', 'specjalistyczna', 'mnemotechnika', 'kliniczna', 'uwaga', 'ogolne'];
        const allDetectedKeys = Object.keys(categoryCounts).filter(k => k !== 'ALL');
        allDetectedKeys.sort((a, b) => {
            const idxA = priorityOrder.indexOf(a);
            const idxB = priorityOrder.indexOf(b);
            if (idxA !== -1 && idxB !== -1) return idxA - idxB;
            if (idxA !== -1) return -1;
            if (idxB !== -1) return 1;
            return a.localeCompare(b);
        });

        allDetectedKeys.forEach(catKey => {
            const def = CATEGORY_DEFINITIONS[catKey] || { label: catKey, color: '#3b82f6' };
            createCategoryChip(catKey, def.label, def.color, categoryCounts[catKey]);
        });

        applyNoteFilters();
    }

    function createCategoryChip(catKey, label, color, count) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'category-chip' + (selectedCategories.has(catKey) ? ' active' : '');
        btn.dataset.category = catKey;

        if (catKey !== 'ALL') {
            const dot = document.createElement('span');
            dot.className = 'chip-dot';
            dot.style.backgroundColor = color;
            btn.appendChild(dot);
        }

        const textSpan = document.createElement('span');
        textSpan.textContent = label;

        const countSpan = document.createElement('span');
        countSpan.className = 'chip-count';
        countSpan.textContent = count;

        btn.appendChild(textSpan);
        btn.appendChild(countSpan);

        // Obsługa wielokrotnego wyboru kategorii (Multi-select)
        btn.addEventListener('click', () => {
            if (catKey === 'ALL') {
                selectedCategories.clear();
                selectedCategories.add('ALL');
            } else {
                selectedCategories.delete('ALL');
                if (selectedCategories.has(catKey)) {
                    selectedCategories.delete(catKey);
                } else {
                    selectedCategories.add(catKey);
                }
                if (selectedCategories.size === 0) {
                    selectedCategories.add('ALL');
                }
            }

            noteCategoryChips.querySelectorAll('.category-chip').forEach(chip => {
                chip.classList.toggle('active', selectedCategories.has(chip.dataset.category));
            });

            applyNoteFilters();
        });

        noteCategoryChips.appendChild(btn);
    }

    function doesNoteMatch(item) {
        const catMatch = selectedCategories.has('ALL') || selectedCategories.has(item.catKey);
        if (!catMatch) return false;

        if (activeNoteQuery.length > 0 && !item.searchHaystack.includes(activeNoteQuery)) {
            return false;
        }
        return true;
    }

    // Aktualizuje zarówno znaczniki w tekście, jak i listę kart w menu
    function applyNoteFilters() {
        filteredNotesList.innerHTML = '';
        let matchedItems = [];

        indexedNotes.forEach(item => {
            const isMatch = doesNoteMatch(item);

            if (isMatch) {
                matchedItems.push(item);
                item.marker.classList.remove('filter-dimmed', 'filter-hidden');
            } else {
                item.noteDiv.classList.remove('is-expanded');
                item.marker.classList.remove('active');

                if (hideUnmatchedMarkers) {
                    item.marker.classList.add('filter-hidden');
                    item.marker.classList.remove('filter-dimmed');
                } else {
                    item.marker.classList.add('filter-dimmed');
                    item.marker.classList.remove('filter-hidden');
                }
            }
        });

        tabNotesCount.textContent = `${matchedItems.length}/${indexedNotes.length}`;

        if (matchedItems.length === 0) {
            filteredNotesList.innerHTML = '<div style="color: var(--text-muted); text-align: center; padding: 24px 0;">Brak notatek pasujących do wybranych filtrów.</div>';
            return;
        }

        // Renderowanie kart na liście z nawigacją do tekstu
        const fragment = document.createDocumentFragment();
        matchedItems.forEach(item => {
            const def = CATEGORY_DEFINITIONS[item.catKey] || CATEGORY_DEFINITIONS.ogolne;
            const card = document.createElement('div');
            card.className = 'note-list-card';
            card.setAttribute('data-resolved-cat', item.catKey);

            const header = document.createElement('div');
            header.className = 'note-card-header';

            const badge = document.createElement('span');
            badge.className = 'note-card-badge';
            badge.textContent = `${def.label} (${item.marker.textContent.trim()})`;

            const section = document.createElement('span');
            section.className = 'note-card-section';
            section.textContent = item.sectionTitle;

            header.appendChild(badge);
            header.appendChild(section);

            const preview = document.createElement('div');
            preview.className = 'note-card-preview';
            preview.textContent = item.previewText;

            card.appendChild(header);
            card.appendChild(preview);

            // KLIKNIĘCIE KARTY: Zamyka menu, rozwija notatkę w tekście i przewija do niej
            card.addEventListener('click', () => {
                toggleMenu(false);

                // Upewniamy się, że notatka jest umieszczona pod znacznikiem i rozwinięta
                item.marker.parentNode.insertBefore(item.noteDiv, item.marker.nextSibling);
                item.noteDiv.classList.add('is-expanded');
                item.marker.classList.add('active');

                // Płynny skok do notatki i podświetlenie
                setTimeout(() => {
                    item.marker.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    item.noteDiv.classList.remove('jump-highlight');
                    void item.noteDiv.offsetWidth; // restart animacji
                    item.noteDiv.classList.add('jump-highlight');
                }, 120);
            });

            fragment.appendChild(card);
        });

        filteredNotesList.appendChild(fragment);
    }

    noteSearchInput.addEventListener('input', function() {
        activeNoteQuery = this.value.toLowerCase().trim();
        applyNoteFilters();
    });

    chkHideUnmatched.addEventListener('change', function() {
        hideUnmatchedMarkers = this.checked;
        applyNoteFilters();
    });

    document.getElementById('btnExpandFiltered').addEventListener('click', () => {
        indexedNotes.forEach(item => {
            if (doesNoteMatch(item)) {
                item.marker.parentNode.insertBefore(item.noteDiv, item.marker.nextSibling);
                item.noteDiv.classList.add('is-expanded');
                item.marker.classList.add('active');
            } else {
                item.noteDiv.classList.remove('is-expanded');
                item.marker.classList.remove('active');
            }
        });
        toggleMenu(false);
    });

    document.getElementById('btnCollapseAll').addEventListener('click', () => {
        contentArea.querySelectorAll('.wnl-extracted-note.is-expanded').forEach(n => n.classList.remove('is-expanded'));
        contentArea.querySelectorAll('.wnl-note-marker.active').forEach(m => m.classList.remove('active'));
        toggleMenu(false);
    });

    // =========================================
    // 3. WCZYTYWANIE PLIKU HTML
    // =========================================
    document.getElementById('fileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        document.getElementById('fileLabel').textContent = '📄 ' + file.name;

        const reader = new FileReader();
        reader.onload = function(event) {
            const content = event.target.result;
            const parser = new DOMParser();
            const doc = parser.parseFromString(content, 'text/html');
            
            document.querySelectorAll('style[data-injected-style="true"]').forEach(el => el.remove());

            const styles = doc.querySelectorAll('style');
            styles.forEach(styleNode => {
                const newStyle = document.createElement('style');
                newStyle.setAttribute('data-injected-style', 'true');
                newStyle.textContent = styleNode.textContent;
                document.head.appendChild(newStyle);
            });

            const paper = doc.querySelector('#paper');
            contentArea.innerHTML = paper ? paper.innerHTML : doc.body.innerHTML;

            restoreSingleFileImages(doc);
            buildTableOfContents();
            initNotesFilterSystem();

            window.scrollTo({ top: 0, behavior: 'instant' });
            toggleMenu(false);
        };
        reader.readAsText(file);
        e.target.value = '';
    });

    // =========================================
    // 4. SPIS TREŚCI
    // =========================================
    function buildTableOfContents() {
        tocList.innerHTML = '';
        tocSearch.value = '';
        const headers = contentArea.querySelectorAll('h1, h2, h3');
        
        if (headers.length > 0) {
            headers.forEach((h, index) => {
                const text = h.textContent.trim();
                if (!text) return;

                const id = `heading-${index}`;
                h.setAttribute('id', id); 

                const li = document.createElement('li');
                const a = document.createElement('a');
                a.href = `#${id}`;
                a.textContent = text;
                a.classList.add(`toc-${h.tagName.toLowerCase()}`);
                
                a.addEventListener('click', (e) => {
                    e.preventDefault();
                    toggleMenu(false);
                    const targetEl = document.getElementById(id);
                    if (targetEl) {
                        targetEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }
                });

                li.appendChild(a);
                tocList.appendChild(li);
            });
        } else {
            tocList.innerHTML = '<li style="color: var(--text-muted); text-align: center; padding: 24px 0; border: none;">Brak nagłówków H1-H3 w tym pliku.</li>';
        }
    }

    tocSearch.addEventListener('input', function() {
        const query = this.value.toLowerCase().trim();
        const items = tocList.querySelectorAll('li');
        items.forEach(li => {
            const text = li.textContent.toLowerCase();
            li.style.display = text.includes(query) ? '' : 'none';
        });
    });

    // =========================================
    // 5. OBRAZKI SINGLEFILE
    // =========================================
    function restoreSingleFileImages(doc) {
        const styles = doc.querySelectorAll('style');
        let allCSS = '';
        styles.forEach(s => allCSS += s.textContent);

        const sfImages = {};
        const regex = /(--sf-img-\d+)\s*:\s*url\(['"]?(data:image\/[^'"\)]+)['"]?\)/g;
        let match;
        while ((match = regex.exec(allCSS)) !== null) {
            sfImages[match[1]] = match[2]; 
        }

        const images = contentArea.querySelectorAll('img');
        
        images.forEach(img => {
            const currentSrc = img.getAttribute('src') || '';
            const styleAttr = img.getAttribute('style') || '';
            const sfSrc = img.getAttribute('data-sf-original-src') || '';
            const parentPicture = img.closest('picture');

            if (currentSrc.startsWith('data:image/svg+xml')) {
                let newSrc = null;
                const varMatch = styleAttr.match(/var\((--sf-img-\d+)\)/);
                if (varMatch && sfImages[varMatch[1]]) {
                    newSrc = sfImages[varMatch[1]];
                } 
                else if (sfSrc.startsWith('data:image')) {
                    newSrc = sfSrc;
                }

                if (newSrc) {
                    img.src = newSrc;
                    img.style.backgroundImage = 'none';
                    img.style.backgroundBlendMode = 'normal';
                }
            } 
            else if (parentPicture) {
                const source = parentPicture.querySelector('source');
                if (source && source.getAttribute('srcset')) {
                    const srcsetUrl = source.getAttribute('srcset').split(',')[0].split(' ')[0].trim();
                    if (srcsetUrl.startsWith('data:image')) {
                        img.src = srcsetUrl;
                    }
                }
            }
        });
    }

    // =========================================
    // 6. INTERAKCJA W TEKŚCIE (NOTATKI + LIGHTBOX)
    // =========================================
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxClose = document.getElementById('lightbox-close');

    contentArea.addEventListener('click', function(e) {
        const marker = e.target.closest('.wnl-note-marker');
        if (marker) {
            const targetId = marker.getAttribute('data-target-note');
            if (!targetId) return;

            const noteDiv = document.getElementById(targetId);
            if (noteDiv) {
                const isExpanded = noteDiv.classList.contains('is-expanded');
                if (!isExpanded) {
                    marker.parentNode.insertBefore(noteDiv, marker.nextSibling);
                    noteDiv.classList.add('is-expanded');
                    marker.classList.add('active');
                } else {
                    noteDiv.classList.remove('is-expanded');
                    marker.classList.remove('active');
                }
            }
            return;
        }

        const clickedImg = e.target.closest('img');
        if (clickedImg && clickedImg.src) {
            lightboxImg.src = clickedImg.src;
            lightbox.classList.add('active');
        }
    });

    function closeLightbox() {
        lightbox.classList.remove('active');
        lightboxImg.src = '';
    }
    lightboxClose.addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', (e) => {
        if (e.target === lightbox) closeLightbox();
    });
</script>
</body>
