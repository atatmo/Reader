<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile HTML Reader</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <style>
        :root {
            /* Czysty, natywny wygląd - usunięto szare tło */
            --surface-color: #ffffff;
            --text-main: #111827;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --accent: #2563eb;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; 
            background: var(--surface-color); 
            color: var(--text-main);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }
        
        /* =========================================
           NOWY INTERFEJS (UKRYTE MENU Z DOŁU)
           ========================================= */

        /* Pływający przycisk (FAB) */
        #menu-btn {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 50%;
            width: 56px;
            height: 56px;
            font-size: 24px;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
            z-index: 1000;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease, background 0.2s;
        }
        #menu-btn:active { transform: scale(0.92); background: #1d4ed8; }

        /* Przyciemnienie tła, gdy menu jest otwarte */
        #backdrop {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 998;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        #backdrop.open {
            opacity: 1;
            pointer-events: all;
        }

        /* Menu wysuwane z dołu (Bottom Sheet) */
        #controls { 
            position: fixed;
            bottom: 0; left: 0; width: 100%;
            background: var(--surface-color); 
            padding: 24px 20px 40px 20px; 
            box-sizing: border-box;
            border-radius: 24px 24px 0 0;
            box-shadow: 0 -10px 25px rgba(0,0,0,0.1);
            z-index: 999; 
            transform: translateY(110%);
            transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
            max-height: 85vh;
            display: flex;
            flex-direction: column;
        }
        #controls.open {
            transform: translateY(0);
        }

        /* Wygląd wnętrza menu */
        .menu-header {
            font-weight: 600;
            font-size: 18px;
            margin-bottom: 16px;
            text-align: center;
        }
        .file-input-wrapper {
            background: #f3f4f6;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 16px;
        }
        input[type="file"] { width: 100%; font-size: 14px; }
        
        #toc-wrapper { flex-grow: 1; display: none; overflow: hidden; display: flex; flex-direction: column; }
        #toc { 
            overflow-y: auto; 
            flex-grow: 1;
            padding-right: 10px;
        }
        #tocList { margin: 0; padding-left: 0; list-style: none; font-size: 16px; }
        #tocList li { margin-bottom: 14px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px;}
        #tocList a { color: var(--text-main); text-decoration: none; display: block; }
        
        /* =========================================
           CZYTNIK (EDGE-TO-EDGE)
           ========================================= */

        #viewer-container { 
            width: 100%; 
            min-height: 100vh; 
            /* Tekst ma bezpieczny margines (16px), ale nie ma ograniczeń szerokości */
            padding: 20px 16px 100px 16px;
            box-sizing: border-box;
            overflow-x: hidden; 
        }
        
        #contentArea { word-wrap: break-word; font-size: 17px; }

        /* Agresywne rozpychanie obrazków na pełną szerokość ekranu (łamanie marginesów) */
        .wnl-extracted-image, #contentArea > img {
            margin: 32px -16px !important; /* -16px niweluje padding kontenera */
            padding: 0 !important;
            background: transparent !important;
            border-radius: 0 !important;
            width: calc(100% + 32px) !important;
            max-width: calc(100% + 32px) !important;
            box-sizing: border-box !important;
        }
        
        .wnl-extracted-image img {
            width: 100% !important;
            height: auto !important;
            border-radius: 0 !important;
            display: block;
        }

        /* Notatki interaktywne */
        .wnl-note-marker {
            cursor: pointer;
            background-color: #f3f4f6;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            padding: 2px 8px !important;
            margin: 0 4px;
            font-weight: 500;
            user-select: none;
            display: inline-block; 
        }
        .wnl-note-marker.active { background-color: #dbeafe; border-color: #93c5fd; color: #1e40af;}

        .wnl-extracted-note {
            display: none !important; 
            opacity: 0;
            width: 100% !important; 
            box-sizing: border-box !important; 
            margin: 16px 0 !important; 
            padding: 16px !important;
            border-radius: 12px !important;
            background: #f8fafc;
            border: 1px solid var(--border-color);
            clear: both !important;
        }
        .wnl-extracted-note.is-expanded {
            display: block !important;
            opacity: 1;
            animation: slideDown 0.2s ease-out forwards;
        }
        
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .wnl-extracted-note[data-category="mnemotechnika"] {
            border-left: 4px solid #a855f7 !important;
            background-color: #faf5ff !important;
        }
    </style>
</head>
<body>

<button id="menu-btn">📚</button>

<div id="backdrop"></div>

<div id="controls">
    <div class="menu-header">Opcje czytnika</div>
    <div class="file-input-wrapper">
        <input type="file" id="fileInput" accept=".html">
    </div>
    <div id="toc-wrapper">
        <div style="font-weight: 600; margin-bottom: 12px; color: var(--text-muted);">SPIS TREŚCI</div>
        <div id="toc">
            <ul id="tocList"></ul>
        </div>
    </div>
</div>

<div id="viewer-container">
    <div id="contentArea" style="text-align: center; color: #9ca3af; margin-top: 40vh;">
        Wczytaj bazę z menu w prawym dolnym rogu.
    </div>
</div>

<script>
    // Obsługa wysuwanego menu
    const menuBtn = document.getElementById('menu-btn');
    const controls = document.getElementById('controls');
    const backdrop = document.getElementById('backdrop');

    function toggleMenu() {
        controls.classList.toggle('open');
        backdrop.classList.toggle('open');
    }

    menuBtn.addEventListener('click', toggleMenu);
    backdrop.addEventListener('click', toggleMenu);

    // Ładowanie pliku
    document.getElementById('fileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const content = e.target.result;
            const parser = new DOMParser();
            const doc = parser.parseFromString(content, 'text/html');
            
            // Wstrzykiwanie oryginalnych stylów SingleFile
            const styles = doc.querySelectorAll('style');
            styles.forEach(styleNode => {
                const newStyle = document.createElement('style');
                newStyle.innerHTML = styleNode.innerHTML;
                document.head.appendChild(newStyle);
            });

            // Wrzucanie treści
            let mainContent = doc.querySelector('#paper') ? doc.querySelector('#paper').innerHTML : doc.body.innerHTML;
            document.getElementById('contentArea').innerHTML = mainContent;

            // Naprawa obrazków (ten sam świetny mechanizm co w poprzedniej wersji)
            restoreSingleFileImages(doc);

            // Spis treści
            const tocList = document.getElementById('tocList');
            tocList.innerHTML = '';
            const headers = document.getElementById('contentArea').querySelectorAll('h1, h2, h3');
            
            if(headers.length > 0) {
                document.getElementById('toc-wrapper').style.display = 'flex';
                headers.forEach((h, index) => {
                    const id = `heading-${index}`;
                    h.setAttribute('id', id); 
                    const li = document.createElement('li');
                    li.innerHTML = `<a href="#${id}">${h.innerText}</a>`;
                    
                    // Po kliknięciu w link, skocz i zamknij menu automatycznie
                    li.querySelector('a').addEventListener('click', () => {
                        toggleMenu();
                    });
                    tocList.appendChild(li);
                });
            } else {
                document.getElementById('toc-wrapper').style.display = 'none';
            }

            setupInteractiveNotes();
            
            // Po udanym wczytaniu pliku automatycznie schowaj menu, by pokazać treść
            toggleMenu();
        };
        reader.readAsText(file);
    });

    function restoreSingleFileImages(doc) {
        const styles = doc.querySelectorAll('style');
        let allCSS = '';
        styles.forEach(s => allCSS += s.innerHTML);

        const sfImages = {};
        const regex = /(--sf-img-\d+)\s*:\s*url\(['"]?(data:image\/[^'"\)]+)['"]?\)/g;
        let match;
        while ((match = regex.exec(allCSS)) !== null) {
            sfImages[match[1]] = match[2]; 
        }

        const contentArea = document.getElementById('contentArea');
        const images = contentArea.querySelectorAll('img');
        
        images.forEach(img => {
            const currentSrc = img.getAttribute('src') || '';
            const styleAttr = img.getAttribute('style') || '';
            const sfSrc = img.getAttribute('data-sf-original-src') || '';
            const parentPicture = img.closest('picture');

            if (currentSrc.startsWith('data:image/svg+xml')) {
                let newSrc = null;
                const varMatch = styleAttr.match(/var\((--sf-img-\d+)\)/);
                if (varMatch && sfImages[varMatch[1]]) {
                    newSrc = sfImages[varMatch[1]];
                } 
                else if (sfSrc.startsWith('data:image')) {
                    newSrc = sfSrc;
                }

                if (newSrc) {
                    img.src = newSrc;
                    img.style.backgroundImage = 'none';
                    img.style.backgroundBlendMode = 'normal';
                }
            } 
            else if (parentPicture) {
                const source = parentPicture.querySelector('source');
                if (source && source.getAttribute('srcset')) {
                    const srcsetUrl = source.getAttribute('srcset').split(',')[0].split(' ')[0].trim();
                    if (srcsetUrl.startsWith('data:image')) {
                        img.src = srcsetUrl;
                    }
                }
            }
        });
    }

    function setupInteractiveNotes() {
        const contentArea = document.getElementById('contentArea');
        
        contentArea.addEventListener('click', function(e) {
            const marker = e.target.closest('.wnl-note-marker');
            if (marker) {
                const targetId = marker.getAttribute('data-target-note');
                if (!targetId) return;

                const noteDiv = document.getElementById(targetId);
                if (noteDiv) {
                    const isExpanded = noteDiv.classList.contains('is-expanded');
                    
                    if (!isExpanded) {
                        marker.parentNode.insertBefore(noteDiv, marker.nextSibling);
                    }

                    if (isExpanded) {
                        noteDiv.classList.remove('is-expanded');
                        marker.classList.remove('active');
                    } else {
                        noteDiv.classList.add('is-expanded');
                        marker.classList.add('active');
                    }
                }
            }
        });
    }
</script>
</body>
</html>
